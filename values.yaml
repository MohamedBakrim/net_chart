# Default values for net_chart.
# Bakrim (streambert) web app - Vite/React static build served by nginx.

replicaCount: 2

image:
  # Build with:
  #   docker build -f net_chart/Dockerfile -t bakrim:<tag> C:\Users\idk\Desktop\homenet\streambert
  # Registry-free transfer to a server (no Docker Hub / GHCR needed):
  #   net_chart\Send-BakrimImage.ps1 -Server user@your-server
  # A plain name (no registry prefix) is intentional: the image is loaded onto
  # the node directly, and pullPolicy IfNotPresent makes kubelet use the local
  # copy instead of trying to pull from a registry.
  repository: bakrim
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion when empty
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 101
  runAsNonRoot: true
  runAsUser: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 101

service:
  type: ClusterIP
  port: 80
  annotations: {}
  # Optional nodePort used when type is NodePort
  nodePort: null

ingress:
  enabled: true
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: bakrim.ma
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: bakrim-tls
  #    hosts:
  #      - bakrim.ma

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Extra environment variables for the nginx container
extraEnv: []
#  - name: TZ
#    value: UTC

# Extra volumes / volume mounts for the nginx container
extraVolumes: []
extraVolumeMounts: []

# nginx configuration rendered into a ConfigMap and mounted over
# /etc/nginx/conf.d/default.conf
nginx:
  # Bump this (or add a checksum/annotation) to force a rollout on config change
  configChecksumAnnotation: true
  # Enable gzip compression for text assets
  gzip: true
  # Extra directives injected verbatim into the default server block.
  # Multi-line strings are supported; keep them properly indented YAML.
  extraServerDirectives: ""
  #  add_header X-Frame-Options "SAMEORIGIN" always;
  #  add_header Permissions-Policy "camera=(), microphone=()" always;
  # Client max body size (static assets only, so small is fine)
  clientMaxBodySize: 16m

# Probes are aimed at the nginx container port
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Strategy for rolling updates
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ---------------------------------------------------------------------------
# Player proxy — BAKED INTO THE APP'S NGINX (no separate pod or service).
#
# The web build loads third-party player embeds into an <iframe>, which
# nothing server-side can see on their origin: the VidSrc chain hotlink-
# checks the Referer (403 from bakrim.ma) and sends X-Frame-Options/CSP
# that refuse framing. So /e/<host>/<path> on the app's own nginx proxies
# to the real embed origin with the Referer it expects, strips the framing
# headers, re-anchors absolute + root-relative refs under /e/<host>/,
# injects <base> + guard.js (popunders, fetch/XHR/DOM calls to ad hosts),
# and keeps redirect chains inside the proxy.
# The web build wraps its iframe src via src/utils/playerProxy.js.
playerProxy:
  enabled: true
  # k3s CoreDNS ClusterIP; required because proxy_pass uses variables.
  resolver: "10.43.0.10"
  # ── Navigation ALLOWLIST (sw.js): only these hosts + our own /e/ proxy
  # docs may render as a document inside the player. A new *player* domain
  # must be added here or its embed gets blocked like an ad — same model as
  # PLAYER_FRAME_HOSTS in index.js.
  playerHosts:
    - vidcore.org
    - edgeone.dev
    - vsembed.su
    - stellarconductornexus.com
    - allmanga.to
    - xonaflix.space
    - created.app
  # ── THE blocklist ───────────────────────────────────────────────────────
  # Baked into guard.js + sw.js at render time (this replaces the old live
  # /filter rules ConfigMap — that whole path is gone; edit here + push).
  blockedHosts:
    - apiguinee.org
    - benchform.org
    - biomanos.org
    - static.nresystems.com
    - cdn.show-sb.com
    - cdn.holdbitter.com
    - mamshirt.com
    - portalfluently.com
    - crdcntrl.net
    - dtscout.com
    - adsco.re
    - bvtpk.com
    - rtmark.net
    - b7510.com
    - unbrownunflat.com
    - malocacomals.com
    - sixmossin.com
    - realizationnewestfangs.com
    - acscdn.com
    - taloseempest.com
    - profitableratecpm.com
    - preferencenail.com
    - protrafficinspector.com
    - histats.com
    - weirdopt.com
    - kettledroopingcontinuation.com
    - wayfarerorthodox.com
    - woxaglasuy.net
    - adeptspiritual.com
    - calculating-laugh.com
    - amavhxdlofklxjg.xyz
