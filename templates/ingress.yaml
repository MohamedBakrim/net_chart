{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "net_chart.fullname" . }}
  labels:
    {{- include "net_chart.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "net_chart.fullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- if $.Values.playerProxy.enabled }}
          - path: /e/
            pathType: Prefix
            backend:
              service:
                name: {{ include "net_chart.fullname" $ }}-playerproxy
                port:
                  name: http
          - path: /v
            pathType: Prefix
            backend:
              service:
                name: {{ include "net_chart.fullname" $ }}-playerproxy
                port:
                  name: http
          {{- end }}
          {{- if $.Values.filterUi.enabled }}
          - path: /filter
            pathType: Prefix
            backend:
              service:
                name: {{ include "net_chart.fullname" $ }}-filterui
                port:
                  name: http
          - path: /am
            pathType: Prefix
            backend:
              service:
                name: {{ include "net_chart.fullname" $ }}-filterui
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
