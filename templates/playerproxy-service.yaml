{{- if .Values.playerProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "net_chart.fullname" . }}-playerproxy
  labels:
    {{- include "net_chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: playerproxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "net_chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: playerproxy
{{- end }}
