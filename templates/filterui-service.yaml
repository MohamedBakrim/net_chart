{{- if .Values.filterUi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "net_chart.fullname" . }}-filterui
  labels:
    {{- include "net_chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: filterui
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "net_chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: filterui
{{- end }}
