{{- if .Values.playerProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "net_chart.fullname" . }}-playerproxy
  labels:
    {{- include "net_chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: playerproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "net_chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: playerproxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/playerproxy-config: {{ include (print $.Template.BasePath "/playerproxy-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "net_chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: playerproxy
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "net_chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: playerproxy
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.playerProxy.image.repository }}:{{ .Values.playerProxy.image.tag }}"
          imagePullPolicy: {{ .Values.playerProxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.playerProxy.resources | nindent 12 }}
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: proxy.conf
              readOnly: true
            - name: proxy-config
              mountPath: /etc/player-proxy/guard.js
              subPath: guard.js
              readOnly: true
            - name: proxy-config
              mountPath: /etc/player-proxy/sw.js
              subPath: sw.js
              readOnly: true
            # Whole directory (NO subPath — subPath mounts never get kubelet's
            # live ConfigMap updates, and this file must update within ~60s).
            - name: rules
              mountPath: /etc/player-proxy/rules
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: proxy-config
          configMap:
            name: {{ include "net_chart.fullname" . }}-playerproxy
        - name: rules
          configMap:
            name: {{ include "net_chart.fullname" . }}-rules
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
