{{- if .Values.filterUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "net_chart.fullname" . }}-filterui
  labels:
    {{- include "net_chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: filterui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "net_chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: filterui
  template:
    metadata:
      annotations:
        # token lives in the Secret — roll the pod when it changes
        checksum/filterui-secret: {{ include (print $.Template.BasePath "/filterui-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "net_chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: filterui
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "net_chart.fullname" . }}-filterui
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: filterui
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          image: "{{ .Values.filterUi.image.repository }}:{{ .Values.filterUi.image.tag }}"
          imagePullPolicy: {{ .Values.filterUi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: RULES_CONFIGMAP
              value: {{ include "net_chart.fullname" . }}-rules
            - name: FILTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "net_chart.fullname" . }}-filterui
                  key: token
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.filterUi.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
