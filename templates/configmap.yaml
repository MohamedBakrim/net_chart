apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "net_chart.fullname" . }}
  labels:
    {{- include "net_chart.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        client_max_body_size {{ .Values.nginx.clientMaxBodySize }};

        # Liveness/readiness endpoint
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # Hashed build assets can be cached aggressively
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # TMDB token for the clients (remoteConfig.js fetches this path).
        # Backed by the tmdb Secret mounted into this pod — kubelet refreshes
        # the mounted file within ~60s of a secret edit, so rotating the token
        # needs no rebuild or redeploy. ACAO * covers the desktop app's
        # cross-origin fetch.
        location = /config.json {
            alias /usr/share/nginx/tmdb-config/config.json;
            default_type application/json;
            add_header Cache-Control "no-store";
            add_header Access-Control-Allow-Origin "*" always;
        }

        # SPA fallback - React Router style routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Never cache the entry document itself
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        {{- if .Values.nginx.gzip }}
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml
            font/woff2;
        {{- end }}

        {{- with .Values.nginx.extraServerDirectives }}
        {{ . }}
        {{- end }}

        # Basic hardening headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
