{{- if .Values.filterUi.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "net_chart.fullname" . }}-filterui
  labels:
    {{- include "net_chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shared admin token for the /filter page (see filterUi.token in values).
  token: {{ .Values.filterUi.token | quote }}
{{- end }}
